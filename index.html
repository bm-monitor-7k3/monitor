<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="description" content="Status of trading bots, read from a private repository with a key kept on this device.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Bot Monitor</title>
<style>
:root{
  --bg:#f3f5f8;--card:#fff;--card2:#f6f8fb;--text:#121826;--mute:#667085;--line:#e4e8ee;
  --good:#12803f;--good-bg:rgba(18,128,63,.12);--bad:#c0262d;--bad-bg:rgba(192,38,45,.12);--warn:#b45309;--warn-bg:rgba(180,83,9,.12);
  --accent:#3b6fd4;--shadow:0 1px 2px rgba(16,24,40,.06),0 6px 18px rgba(16,24,40,.06);
  --botA:#2563eb;--botB:#7c3aed;--botC:#d97706;--botD:#059669;--botE:#db2777;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0b0e13;--card:#141922;--card2:#10151c;--text:#e8ebf0;--mute:#8a94a6;--line:#242c38;
  --good:#3ddc84;--good-bg:rgba(61,220,132,.14);--bad:#ff6b6b;--bad-bg:rgba(255,107,107,.14);--warn:#fbbf24;--warn-bg:rgba(251,191,36,.14);
  --accent:#7aa2f7;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3);
  --botA:#60a5fa;--botB:#a78bfa;--botC:#fbbf24;--botD:#34d399;--botE:#f472b6;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;
  background:radial-gradient(700px 300px at 0% -5%,color-mix(in srgb,var(--botA) 16%,transparent),transparent 70%),radial-gradient(600px 300px at 100% -5%,color-mix(in srgb,var(--botE) 12%,transparent),transparent 70%),var(--bg);background-attachment:fixed}
.num{font-variant-numeric:tabular-nums}
.good{color:var(--good)}.bad{color:var(--bad)}.mute{color:var(--mute)}.warn{color:var(--warn)}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:color-mix(in srgb,var(--card) 85%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.logo{width:34px;height:34px;border-radius:10px;flex:none;background:conic-gradient(from 210deg,var(--botA),var(--botB),var(--botE),var(--botC),var(--botD),var(--botA))}
header h1{font-size:17px;margin:0;line-height:1.1}
header .sub{font-size:12px;color:var(--mute)}
header .grow{flex:1;min-width:0}
.icon{border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:11px;width:40px;height:40px;font-size:18px;display:grid;place-items:center;cursor:pointer}
.icon.spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
main{max-width:680px;margin:0 auto;padding:14px 16px calc(40px + env(safe-area-inset-bottom));display:grid;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.card>h2{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);margin:0;padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
.pad{padding:14px 16px}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:650}
.chip.good{background:var(--good-bg);color:var(--good)}.chip.bad{background:var(--bad-bg);color:var(--bad)}.chip.flat{background:var(--card2);color:var(--mute);border:1px solid var(--line)}
.banner{border-radius:12px;padding:10px 14px;font-size:13px}
.banner.warn{background:var(--warn-bg);color:var(--warn)}.banner.bad{background:var(--bad-bg);color:var(--bad)}
.total{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.total .big{font-size:30px;font-weight:780;letter-spacing:-.02em}
.botcard{position:relative;background:var(--card);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:16px;padding:14px 16px 12px;box-shadow:var(--shadow);overflow:hidden;cursor:pointer;display:grid;gap:8px}
.botcard::before{content:"";position:absolute;inset:0;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 15%,transparent),transparent 55%);pointer-events:none}
.botcard>*{position:relative}
.bc-top{display:flex;align-items:center;gap:10px}
.badge{width:34px;height:34px;border-radius:10px;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.bc-name{font-weight:720}
.bc-desc{font-size:12px;color:var(--mute)}
.bc-net{margin-left:auto;text-align:right}
.bc-net b{font-size:22px;letter-spacing:-.01em}
.stats{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);padding-top:8px}
.stats div{display:flex;flex-direction:column}.stats b{font-size:15px}.stats span{font-size:11px;color:var(--mute)}
.foot{font-size:11.5px;color:var(--mute)}
.spark{width:100%;height:36px;display:block}
.seg{display:flex;gap:4px}
.seg button{border:1px solid var(--line);background:var(--card2);color:var(--mute);border-radius:8px;padding:3px 10px;font:inherit;font-size:12px;text-transform:none;letter-spacing:0;cursor:pointer}
.seg button.act{color:var(--text);border-color:var(--accent);background:var(--card)}
.legend{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px 0}
.legend button{font:inherit;font-size:12.5px;font-weight:650;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:99px;padding:4px 10px;cursor:pointer}
.legend button i{width:12px;height:4px;border-radius:2px;background:var(--c)}
.legend button.off{opacity:.4;text-decoration:line-through}
#chartwrap{position:relative;padding:4px 6px 6px}
#chart{width:100%;height:240px;display:block;touch-action:pan-y}
.tip{position:absolute;pointer-events:none;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:12px;box-shadow:var(--shadow);display:none;white-space:nowrap;z-index:3}
.tip .tr{display:flex;align-items:center;gap:7px;justify-content:space-between}.tip i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.note{padding:10px 16px;color:var(--mute);font-size:12px;border-top:1px solid var(--line)}
.list{display:grid}
.row{display:flex;align-items:center;gap:10px;padding:10px 16px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .l{flex:1;min-width:0}.row .r{text-align:right}
.row .t{font-weight:650}.row .s{font-size:12px;color:var(--mute);overflow:hidden;text-overflow:ellipsis}
.empty{padding:18px 16px;color:var(--mute);text-align:center;font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr}
.kv{padding:10px 16px;border-top:1px solid var(--line)}
.kv:nth-child(odd){border-right:1px solid var(--line)}
.kv span{display:block;font-size:12px;color:var(--mute)}.kv b{font-size:16px}
.back{display:flex;align-items:center;gap:10px}
.btn{text-decoration:none;display:inline-block;font:inherit;font-weight:650;border-radius:11px;padding:10px 14px;border:1px solid var(--line);background:var(--card2);color:var(--text);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.5}
input{width:100%;font:inherit;padding:11px 12px;border-radius:11px;border:1px solid var(--line);background:var(--card2);color:var(--text)}
label{display:block;font-size:13px;color:var(--mute);margin:12px 0 6px}
ol{margin:6px 0 0;padding-left:20px}ol li{margin:4px 0}
pre{margin:0;padding:10px 16px;font:12px/1.6 ui-monospace,Consolas,monospace;white-space:pre-wrap;color:var(--mute)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:12px;padding:10px 16px;font-size:13px;display:none;z-index:20;max-width:90vw}
.hidden{display:none!important}
.sig{border-top:1px solid var(--line)}
.sig summary{list-style:none;display:flex;align-items:center;gap:10px;padding:10px 16px;cursor:pointer}
.sig summary::-webkit-details-marker{display:none}
.sig summary .l{flex:1;min-width:0}
.sig summary .t{font-weight:650}
.sig summary .s{font-size:12px;color:var(--mute)}
.sig summary .r{text-align:right;font-size:13px}
.sig[open] summary{background:var(--card2)}
.sig .lv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:4px 16px 12px;font-size:13px;background:var(--card2)}
.sig .lv span:nth-child(odd){color:var(--mute)}
.rank{display:inline-block;font-size:11px;font-weight:700;padding:0 6px;border-radius:6px;background:var(--good-bg);color:var(--good);margin-left:4px}
.subh{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);font-weight:650;padding:12px 16px 4px;border-top:1px solid var(--line)}
.mini{display:flex;justify-content:space-between;gap:10px;padding:7px 16px;font-size:13px;border-top:1px solid var(--line)}
.mini .s{color:var(--mute);font-size:12px}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:0 7px;border-radius:6px;background:var(--card2);border:1px solid var(--line)}
.cands{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:0 16px 10px;font-size:12.5px}.cands:empty{display:none}
.cands button{font:inherit;font-size:12.5px;border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:99px;padding:4px 10px;cursor:pointer}
.sres{padding:4px 16px 16px;display:grid;gap:12px}
.shead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.sname{font-weight:720;font-size:17px}.sprice{font-size:21px}
.verdict{border-radius:12px;padding:10px 14px;font-weight:700;background:var(--card2);border:1px solid var(--line)}
.verdict.good{background:var(--good-bg);color:var(--good);border-color:transparent}.verdict.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}.verdict.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.vnote{font-weight:500;font-size:12.5px;opacity:.85}
.rulegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr));gap:10px}
.rule{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--card2);display:grid;gap:8px;align-content:start;min-width:0}
.rule .rh{display:flex;justify-content:space-between;gap:8px;align-items:center}.rule .rt{font-size:13px}
.lvl{width:100%;border-collapse:collapse;font-size:12.5px}.lvl td{padding:5px 0;border-top:1px solid var(--line);vertical-align:top}.lvl td.num{text-align:right;white-space:nowrap;padding-left:10px}
.sfacts{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.sfacts div{border:1px solid var(--line);border-radius:10px;padding:8px 10px}.sfacts span{display:block;font-size:11.5px;color:var(--mute)}.sfacts b{font-size:13.5px;font-weight:650}
.slegend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--mute);padding-top:2px}
.slegend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}.slegend i.dash{background:repeating-linear-gradient(90deg,var(--mute) 0 4px,transparent 4px 7px)}
.pill.good{background:var(--good-bg);color:var(--good);border-color:transparent}.pill.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}.pill.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
</style>
</head>
<body>
<header>
  <div class="logo" aria-hidden="true"></div>
  <div class="grow"><h1 id="title">Bot Monitor</h1><div class="sub" id="sub">loading…</div></div>
  <button class="icon" id="refresh" title="Refresh" aria-label="Refresh">⟳</button>
  <button class="icon" id="gear" title="Settings" aria-label="Settings">⚙</button>
</header>
<main id="home"></main>
<main id="detail" class="hidden"></main>
<main id="settings" class="hidden"></main>
<div id="toast"></div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=(n,sign=true)=>n==null?"–":(n<0?"−":(sign&&n>0?"+":""))+"$"+Math.abs(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const pct=(n)=>n==null?"–":(n>0?"+":n<0?"−":"")+Math.abs(n).toFixed(2)+"%";
const sgn=n=>n>0?"good":n<0?"bad":"mute";
const chip=n=>'<span class="chip '+(n>0?"good":n<0?"bad":"flat")+'">'+pct(n)+'</span>';
const ago=t=>{const m=Math.round((Date.now()-new Date(t).getTime())/60000);return m<1?"just now":m<60?m+" min ago":m<1440?Math.floor(m/60)+"h "+(m%60)+"m ago":Math.floor(m/1440)+"d ago";};
const fmt=n=>n==null?"–":Math.abs(n)>=1000?Number(n).toLocaleString("en-US",{maximumFractionDigits:2}):String(n);
const COL={A:"var(--botA)",B:"var(--botB)",C:"var(--botC)",D:"var(--botD)",E:"var(--botE)"};
const PAL=["var(--botA)","var(--botB)","var(--botC)","var(--botD)","var(--botE)","#0891b2","#e11d48"];
const color=(id,i)=>COL[id]||PAL[i%PAL.length];
const store={get:(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:v;}catch(e){return d;}},set:(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}},del:k=>{try{localStorage.removeItem(k);}catch(e){}}};
function toast(m,ms=4000){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',ms);}

let DATA=null,RANGE=store.get('range','All'),HIDDEN={};try{HIDDEN=JSON.parse(store.get('hidden','{}'));}catch(e){}
const RANGES={"1W":7*864e5,"1M":30*864e5,"3M":91*864e5,"All":Infinity};
const repo=()=>store.get('repo','');
const token=()=>store.get('token','');
const gh=(path,opt={})=>fetch('https://api.github.com/repos/'+repo()+path,{cache:'no-store',...opt,headers:{'Authorization':'Bearer '+token(),'X-GitHub-Api-Version':'2022-11-28',...(opt.headers||{})}});

async function load(manual){
  if(!token()||!repo()){show('settings');renderSettings('Add your repository and GitHub key to start.');return;}
  $('refresh').classList.add('spin');
  try{
    const r=await gh('/contents/app-status.json',{headers:{'Accept':'application/vnd.github.raw+json'}});
    if(r.status===401)throw new Error('the GitHub key was rejected (401): check it in Settings');
    if(r.status===404)throw new Error('app-status.json not found (404): wrong repository, key without access, or no bot run since the app was added');
    if(!r.ok)throw new Error('GitHub said '+r.status);
    DATA=await r.json();store.set('cache',JSON.stringify(DATA));
    if(manual)toast('Updated');
  }catch(e){
    const c=store.get('cache','');if(c&&!DATA){try{DATA=JSON.parse(c);}catch(_){}}
    toast('Could not refresh: '+e.message,6000);
  }finally{$('refresh').classList.remove('spin');}
  render();
}

function show(view){for(const v of ['home','detail','settings'])$(v).classList.toggle('hidden',v!==view);window.scrollTo(0,0);}
function current(){return location.hash.startsWith('#bot-')?'detail':location.hash==='#settings'?'settings':'home';}
addEventListener('hashchange',render);

function render(){
  const v=current();
  if(v==='settings'){show('settings');renderSettings();return;}
  if(!DATA){$('sub').textContent=token()?'loading…':'no key yet';show('home');$('home').innerHTML='<div class="empty">'+(token()?'Loading…':'Open Settings (⚙) and add your GitHub key.')+'</div>';return;}
  const age=(Date.now()-new Date(DATA.generatedAt).getTime())/36e5;
  $('sub').innerHTML='updated '+esc(ago(DATA.generatedAt))+' · '+(DATA.account==='real'?'<b class="bad">REAL MONEY</b>':'demo');
  if(v==='detail'){const b=DATA.bots.find(x=>'#bot-'+x.id===location.hash);if(b){show('detail');renderDetail(b,DATA.bots.indexOf(b),age);return;}}
  show('home');renderHome(age);
}

function spark(series,c){
  const pts=(series||[]).filter(p=>p.t>=Date.now()-RANGES[RANGE]);if(pts.length<2)return'';
  const W=300,H=36,t0=pts[0].t,t1=pts.at(-1).t;let lo=Math.min(0,...pts.map(p=>p.v)),hi=Math.max(0,...pts.map(p=>p.v));if(hi-lo<1){hi+=.5;lo-=.5;}
  const x=t=>(t-t0)/(t1-t0||1)*W,y=v=>3+(hi-v)/(hi-lo)*(H-6);let d='';pts.forEach((p,i)=>{d+=i?'H'+x(p.t).toFixed(1)+'V'+y(p.v).toFixed(1):'M0,'+y(p.v).toFixed(1);});
  return '<svg class="spark" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none"><line x1="0" x2="'+W+'" y1="'+y(0)+'" y2="'+y(0)+'" style="stroke:var(--line)" stroke-dasharray="3 3"/><path d="'+d+'" fill="none" style="stroke:'+c+'" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>';
}

const GRP={'us-tech':'Tech','us-finance':'Finance','us-health':'Health','us-consumer':'Consumer','us-industrial':'Industrial','us-energy':'Energy','us-index':'Index','metals':'Metal'};
// buy levels fixed at the bots' last daily check: what to use during the next day (they don't move)
function fixedStatus(L,price,low){
  if(low!=null&&low<=L.trigger)return ['good','✓ reached today (low $'+Number(low).toFixed(2)+')'];
  if(price==null)return ['mute','–'];
  if(price<=L.trigger)return ['good','✓ at or below the level now'];
  const need=(L.trigger/price-1)*100;
  return need>-1?['warn','close: '+need.toFixed(1)+'% to go']:['mute',need.toFixed(1)+'% to go'];
}
function renderFixed(sc){
  const F=sc.fixed,Q=sc.quotes||{},fx=sc.eurusd;if(!F||!F.levels)return '';
  const p2=n=>n==null?'–':Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  const ue=v=>v==null?'–':'<b>$'+p2(v)+'</b> <span class="mute">€'+(fx?p2(v/fx):'–')+'</span>';
  const when=new Date(F.at).toLocaleString([],{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
  let h='<div class="subh" style="border-top:0">Fixed buy levels: use these during the day</div><div class="pad mute" style="padding-top:2px;padding-bottom:8px;font-size:12.5px">Set at the bots’ check on '+esc(when)+'. They don’t move with the price: place your limit order at the level and leave it until the next check (21:45), then cancel it if it hasn’t filled.</div>';
  if(!F.levels.length)return h+'<div class="empty">No dip-buy signals at that check.</div>';
  return h+F.levels.map(L=>{const q=Q[L.name]||{},low=q.low!=null&&q.day>F.day?q.low:null,st=fixedStatus(L,q.price,low);
    return '<details class="sig" data-fx="'+esc(L.name)+'" data-trig="'+L.trigger+'" data-day="'+esc(F.day)+'" data-low="'+(low==null?'':low)+'"><summary><div class="l"><div class="t">'+esc(L.name)+(L.bots.length?'<span class="rank">bots: '+esc(L.bots.join(','))+'</span>':'')+'</div><div class="s">'+esc(L.ticker||'')+' · RSI(2) '+L.rsi2+' · <span data-fxst class="'+st[0]+'">'+st[1]+'</span></div></div><div class="r num"><div class="s">buy if it dips to</div>'+ue(L.trigger)+'</div></summary>'+
      '<div class="lv"><span>Buy if it dips to (−'+((1-L.trigger/L.price)*100).toFixed(1)+'% from the check price)</span><span class="num">'+ue(L.trigger)+'</span><span>Stop-loss</span><span class="num">'+ue(L.stop)+'</span><span>Now</span><span class="num" data-fxnow>'+ue(q.price)+'</span><span>Price at the check</span><span class="num">'+ue(L.price)+'</span><span style="grid-column:1/-1;color:var(--text)">Sell: on the first daily close above the 5-day average, or after 10 trading days. After you buy, add it to My trades and it tells you when.</span></div></details>';}).join('');
}
function renderSignals(sc){
  if(!sc)return '<div class="card"><h2>Today\'s signals</h2><div class="empty">Appears after the next bot run (or tap ⚙ › Run now).</div></div>';
  const p2=n=>n==null?'–':Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  const fx=sc.eurusd,ue=v=>v==null?'–':'<b>$'+p2(v)+'</b> <span class="mute">€'+(fx?p2(Number((v/fx).toFixed(2))):'–')+'</span>';
  const sect={};for(const s of sc.signals){const g=GRP[s.group]||s.group;sect[g]=(sect[g]||0)+1;}
  const top=Object.entries(sect).sort((a,b)=>b[1]-a[1])[0];
  let h='<div class="card"><h2>Today\'s signals <span>'+esc(new Date(sc.at).toLocaleString([],{weekday:'short',hour:'2-digit',minute:'2-digit'}))+'</span></h2>';
  h+=renderFixed(sc)+'<div class="subh">Live preview: signals if the check were now (these levels move with the price)</div>';

const p2v=n=>n==null?'–':Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const cleanv=v=>String(v==null?'':v).split('|').join(' ').trim();
async function tradeDispatch(cmd,msg){
  try{const r=await gh('/actions/workflows/swing.yml/dispatches',{method:'POST',headers:{'Accept':'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify({ref:'main',inputs:{test_message:'false',trade:cmd}})});
    if(r.status===204){toast(msg+': shows in about 2 minutes.',6000);setTimeout(()=>load(),150000);return true;}
    toast(r.status===403||r.status===404?'The key needs Actions: Read and write ('+r.status+')':'GitHub said '+r.status,6000);}
  catch(e){toast('Failed: '+e.message);}
  return false;
}
document.addEventListener('submit',async e=>{
  if(e.target.id!=='mtform')return;e.preventDefault();
  const v=id=>cleanv($(id).value);
  const cmd=['add',v('mtsym'),v('mtprice').replace(',','.'),v('mtcur'),v('mtdate')||new Date().toISOString().slice(0,10),v('mtqty').replace(',','.'),''].join('|');
  if(await tradeDispatch(cmd,'Saved'))e.target.reset();
});
document.addEventListener('click',e=>{
  const s=e.target.closest('[data-sell]'),d=e.target.closest('[data-del]');
  if(s){e.preventDefault();const p=prompt('Sell price for '+s.dataset.name+' (in '+(s.dataset.cur==='EUR'?'€':'$')+'):');if(p)tradeDispatch(['close',s.dataset.sell,cleanv(p).replace(',','.'),s.dataset.cur].join('|'),'Marked as sold');}
  if(d){e.preventDefault();if(confirm('Delete '+d.dataset.name+' from My trades?'))tradeDispatch(['delete',d.dataset.del].join('|'),'Deleted');}
});

function valAt(pts,t){let v=0;for(const p of pts){if(p.t>t)break;v=p.v;}return v;}
function drawChart(){
  const bots=DATA.bots,svg=$('chart');if(!svg)return;
  $('legend').innerHTML=bots.map((b,i)=>'<button data-bot="'+esc(b.id)+'" class="'+(HIDDEN[b.id]?'off':'')+'" style="--c:'+color(b.id,i)+'"><i></i>'+esc(b.id)+' <span class="num '+sgn(b.summary.net)+'">'+money(b.summary.net)+'</span></button>').join('');
  $('legend').onclick=e=>{const k=e.target.closest('button');if(!k)return;HIDDEN[k.dataset.bot]=!HIDDEN[k.dataset.bot];store.set('hidden',JSON.stringify(HIDDEN));drawChart();};
  const W=svg.clientWidth||340,H=240,pad={l:46,r:10,t:12,b:22};
  const now=new Date(DATA.generatedAt).getTime(),start=Math.min(...bots.map(b=>b.series[0]?b.series[0].t:now));
  const t0=Math.max(start,now-RANGES[RANGE]),t1=now,span=t1-t0;
  const lines=bots.map((b,i)=>({b,c:color(b.id,i),pts:b.series})).filter(l=>!HIDDEN[l.b.id]&&l.pts.length).map(l=>({...l,seg:[{t:t0,v:valAt(l.pts,t0)}].concat(l.pts.filter(p=>p.t>t0&&p.t<=t1),[{t:t1,v:l.b.summary.net}])}));
  if(!lines.length||span<60e3){svg.setAttribute('viewBox','0 0 '+W+' '+H);svg.innerHTML='<text x="'+W/2+'" y="'+H/2+'" text-anchor="middle" style="fill:var(--mute)" font-size="13">'+(lines.length?'Not enough history yet.':'All bots hidden: tap a name.')+'</text>';return;}
  const all=lines.flatMap(l=>l.seg.map(p=>p.v));let lo=Math.min(0,...all),hi=Math.max(0,...all);if(hi-lo<2){hi+=1;lo-=1;}const pv=(hi-lo)*.12;hi+=pv;lo-=pv;
  const x=t=>pad.l+(t-t0)/span*(W-pad.l-pad.r),y=v=>pad.t+(hi-v)/(hi-lo)*(H-pad.t-pad.b);
  let g='';for(let i=0;i<=4;i++){const v=lo+(hi-lo)*i/4;g+='<line x1="'+pad.l+'" x2="'+(W-pad.r)+'" y1="'+y(v)+'" y2="'+y(v)+'" style="stroke:var(--line)"/><text x="'+(pad.l-6)+'" y="'+(y(v)+4)+'" text-anchor="end" style="fill:var(--mute)" font-size="10">'+(v<0?'−':'')+'$'+Math.abs(v).toFixed(hi-lo<20?1:0)+'</text>';}
  g+='<line x1="'+pad.l+'" x2="'+(W-pad.r)+'" y1="'+y(0)+'" y2="'+y(0)+'" style="stroke:var(--mute)" stroke-dasharray="4 3"/>';
  const fd=t=>new Date(t).toLocaleDateString([],{month:'short',day:'numeric'});
  g+='<text x="'+pad.l+'" y="'+(H-6)+'" style="fill:var(--mute)" font-size="10">'+fd(t0)+'</text><text x="'+(W-pad.r)+'" y="'+(H-6)+'" text-anchor="end" style="fill:var(--mute)" font-size="10">'+fd(t1)+'</text>';
  for(const l of lines){let d='';l.seg.forEach((p,i)=>{d+=i?'H'+x(p.t).toFixed(1)+'V'+y(p.v).toFixed(1):'M'+x(p.t).toFixed(1)+','+y(p.v).toFixed(1);});
    g+='<path d="'+d+'" fill="none" style="stroke:'+l.c+'" stroke-width="2.4" stroke-linejoin="round"/>';
    for(const p of l.seg)if(p.closed)g+='<circle cx="'+x(p.t)+'" cy="'+y(p.v)+'" r="2.8" style="fill:'+l.c+';stroke:var(--card)" stroke-width="1.2"/>';
    const e=l.seg.at(-1);g+='<circle cx="'+x(e.t)+'" cy="'+y(e.v)+'" r="4.5" style="fill:'+l.c+';stroke:var(--card)" stroke-width="2"/>';}
  g+='<line id="xl" y1="'+pad.t+'" y2="'+(H-pad.b)+'" style="stroke:var(--mute);display:none"/>';
  svg.setAttribute('viewBox','0 0 '+W+' '+H);svg.innerHTML=g;
  const tip=$('tip'),xl=$('xl');
  const move=cx=>{const rc=svg.getBoundingClientRect(),mx=(cx-rc.left)*W/rc.width,t=Math.max(t0,Math.min(t1,t0+(mx-pad.l)/(W-pad.l-pad.r)*span));
    xl.setAttribute('x1',x(t));xl.setAttribute('x2',x(t));xl.style.display='';
    tip.innerHTML='<div class="mute" style="margin-bottom:3px">'+new Date(t).toLocaleString([],{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})+'</div>'+lines.map(l=>({l,v:valAt(l.seg,t)})).sort((a,b)=>b.v-a.v).map(o=>'<div class="tr" style="--c:'+o.l.c+'"><span style="display:flex;gap:6px;align-items:center"><i></i>Bot '+esc(o.l.b.id)+'</span><b class="num '+sgn(o.v)+'">'+money(o.v)+'</b></div>').join('');
    tip.style.display='block';tip.style.top='14px';const left=x(t)*rc.width/W;tip.style.left=Math.max(4,Math.min(left+12,rc.width-tip.offsetWidth-4))+'px';};
  svg.onpointermove=e=>move(e.clientX);svg.onpointerdown=e=>move(e.clientX);
  svg.onpointerleave=()=>{tip.style.display='none';xl.style.display='none';};
}

   '<div class="mute" style="font-size:12px;text-align:center">Install: Chrome menu ⋮ › <b>Add to Home screen</b></div>';
  $('save').onclick=()=>{const r=$('repo').value.trim(),t=$('tok').value.trim();if(r)store.set('repo',r);if(t)store.set('token',t);if(!token()||!repo()){toast('Enter the repository and paste a key first');return;}location.hash='';load(true);};
  if($('forget'))$('forget').onclick=()=>{store.del('token');store.del('cache');DATA=null;renderSettings('Key removed from this phone.');};
  $('runnow').onclick=async()=>{const b=$('runnow');b.disabled=true;try{const r=await gh('/actions/workflows/swing.yml/dispatches',{method:'POST',headers:{'Accept':'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify({ref:'main',inputs:{test_message:'false'}})});
    if(r.status===204){toast('Started. New figures in about 2 minutes.',6000);setTimeout(()=>load(),150000);}else toast(r.status===403||r.status===404?'The key needs Actions: Read and write ('+r.status+')':'GitHub said '+r.status,6000);}catch(e){toast('Failed: '+e.message);}setTimeout(()=>b.disabled=false,5000);};
}

$('refresh').onclick=()=>load(true);
$('gear').onclick=()=>{location.hash=location.hash==='#settings'?'':'settings';};
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&DATA&&Date.now()-(load.at||0)>60000){load.at=Date.now();load();}});
addEventListener('resize',()=>{if(current()==='home'&&DATA)drawChart();});
try{const c=store.get('cache','');if(c)DATA=JSON.parse(c);}catch(e){}
render();load.at=Date.now();load();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
<script src="stock.js"></script>
</body>
